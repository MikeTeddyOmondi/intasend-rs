name: Release

# Publishing happens here and nowhere else, and only from a version tag:
#
#     git tag v0.4.0 && git push origin v0.4.0
#
# A tag is a deliberate act. A merge to master is not, which is why the old
# workflow's "publish on every push" was a loaded gun — a published version
# number can never be reused, only yanked.
on:
  push:
    tags: ["v*.*.*"]

# Never two releases at once, and never cancel one half-done: an interrupted
# publish can leave the tag pushed and the crate unpublished.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify the tag matches the crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The one check worth doing before anything else. Tagging v0.4.1 while
      # Cargo.toml still says 0.4.0 publishes 0.4.0 a second time — which fails
      # if it exists, and silently ships the wrong thing if it does not.
      - name: Tag and Cargo.toml agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' intasend/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag  Cargo.toml=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match intasend $crate. Bump Cargo.toml, or retag."
            exit 1
          fi

      - name: The changelog mentions this version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if ! grep -q "$tag" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $tag."
            exit 1
          fi

  test:
    name: fmt, clippy, test
    needs: verify
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Repeated rather than assumed from CI: a tag can point at a commit that
      # never ran through a pull request.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo test --workspace --all-features --locked

  publish:
    name: crates.io
    needs: test
    runs-on: ubuntu-latest
    # Requires a `crates-io` environment on the repository. Add a required
    # reviewer there and a publish waits for a human, which is worth having on
    # an irreversible action.
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish
        run: cargo publish --locked --package intasend
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

  github_release:
    name: GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create the release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
