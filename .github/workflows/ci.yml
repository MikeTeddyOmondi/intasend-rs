name: CI

# Every pull request, and every push to the default branch.
#
# This workflow **never publishes anything**. Releasing is `release.yml`, which
# runs only on a version tag. The previous single workflow published to
# crates.io on any push to master *and* on pull requests — saved from doing so
# only by the version already existing on crates.io. A PR that bumped the
# version would have published from an unmerged branch.
on:
  pull_request:
  push:
    branches: [master]

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Warnings fail in CI without making local builds noisy.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dtolnay/rust-toolchain rather than actions-rs: that org is archived and
      # its actions run on a Node version GitHub has since removed.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      # --locked so CI builds what Cargo.lock says. Without it a fresh
      # resolution can pass here and fail for anyone using the lockfile — which
      # is exactly how a sibling repo's Docker build broke on a pino minor.
      - name: Tests
        run: cargo test --workspace --all-features --locked

      # Deliberately no INTASEND_* secrets: nothing here touches the network.
      # If that changes, put live-credential tests behind a feature and their
      # own job, rather than making every PR depend on a third party being up.

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Broken intra-doc links stay invisible until docs.rs renders them, which
      # is after publishing and too late to fix quietly.
      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  package:
    name: publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Packaging is where releases usually fail: a missing README, an excluded
      # file the crate needs, a path dependency that cannot be published.
      # Catching it on the PR costs nothing. Catching it mid-release means a
      # yanked version, because a published version number can never be reused.
      - name: Package the crate
        run: cargo publish --dry-run --locked --package intasend
