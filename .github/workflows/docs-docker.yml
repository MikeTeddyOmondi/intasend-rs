name: Docs image

# The mdBook docs, built and pushed as a static-site image.
#
# Split out of the old combined workflow, which ran this on pull requests too —
# so a PR pushed `latest` to Docker Hub before anyone reviewed it.
#
# Interim. The docs are moving to Astro Starlight on Cloudflare Pages, at which
# point this workflow and `docs/Dockerfile` both go.
on:
  push:
    branches: [master]
    # Only when the docs actually change. A crate-only commit has no business
    # rebuilding and republishing an image.
    paths:
      - "docs/**"
      - ".github/workflows/docs-docker.yml"
  # Buildable by hand, which is the whole reason the path filter above is safe.
  workflow_dispatch:

concurrency:
  group: docs-image
  cancel-in-progress: true

jobs:
  publish:
    name: build and push
    runs-on: ubuntu-latest
    # Never from a pull request: `latest` should only ever move for something
    # already on master.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build & push
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          image: ranckosolutionsinc/intasend-rs-docs
          # `latest` plus the commit, so a bad deploy can be pinned back to a
          # known image instead of guessing which `latest` was which.
          tags: latest,${{ github.sha }}
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          directory: docs
